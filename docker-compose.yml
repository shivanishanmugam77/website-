# Development stack. Production compose/hardening arrives in Phase 13.
name: catalogue-platform

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is not set - run ./scripts/init-env.sh}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-catalogue}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run ./scripts/init-env.sh}@postgres:5432/${POSTGRES_DB:-catalogue}
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
  COOKIE_SECURE: ${COOKIE_SECURE:-}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
  LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
  STORAGE_LOCAL_ROOT: /data/storage
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
  MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
  RENDER_DPI: ${RENDER_DPI:-150}
  PIPELINE_TIME_LIMIT_MINUTES: ${PIPELINE_TIME_LIMIT_MINUTES:-120}
  STORAGE_TYPE: ${STORAGE_TYPE:-local}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  OCR_ENABLED: ${OCR_ENABLED:-true}
  OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-0.5}
  OCR_TILE_PX: ${OCR_TILE_PX:-1600}
  OCR_TILE_OVERLAP_PX: ${OCR_TILE_OVERLAP_PX:-320}
  PANEL_DETECTION_ENABLED: ${PANEL_DETECTION_ENABLED:-true}
  PRODUCT_DETECTION_ENABLED: ${PRODUCT_DETECTION_ENABLED:-true}
  PRODUCT_MIN_OUTLINE_SCORE: ${PRODUCT_MIN_OUTLINE_SCORE:-0.70}
  PRODUCT_MIN_OUTLINE_COVERAGE: ${PRODUCT_MIN_OUTLINE_COVERAGE:-0.30}
  PANEL_MIN_AREA_SHARE: ${PANEL_MIN_AREA_SHARE:-0.004}
  ML_DEVICE: ${ML_DEVICE:-auto}
  ML_NUM_THREADS: ${ML_NUM_THREADS:-4}
  DETECTION_MODEL: ${DETECTION_MODEL:-IDEA-Research/grounding-dino-tiny}
  SEGMENTATION_MODEL: ${SEGMENTATION_MODEL:-facebook/sam-vit-base}
  DETECTION_PROMPTS: "${DETECTION_PROMPTS:-desk, office chair, cabinet, sofa, meeting table, bookshelf, filing cabinet, locker, reception desk, workstation, table, chair}"
  DETECTION_BOX_THRESHOLD: ${DETECTION_BOX_THRESHOLD:-0.35}
  DETECTION_TEXT_THRESHOLD: ${DETECTION_TEXT_THRESHOLD:-0.25}
  DETECTION_MAX_PX: ${DETECTION_MAX_PX:-1024}
  # Where downloaded models are kept (a Docker volume, so rebuilding the image keeps them).
  HF_HOME: /data/models/huggingface
  HF_HUB_DISABLE_TELEMETRY: "1"
  AI_AUTO_REVIEW_THRESHOLD: ${AI_AUTO_REVIEW_THRESHOLD:-0.85}
  AI_LOW_CONFIDENCE_THRESHOLD: ${AI_LOW_CONFIDENCE_THRESHOLD:-0.60}

x-backend: &backend
  image: catalogue-backend:dev
  build:
    context: ./backend
    target: dev
  environment: *backend-env
  volumes:
    - ./backend/app:/app/app
    - ./backend/tests:/app/tests
    - ./backend/alembic:/app/alembic
    # Pictures written by the check_products command, to look at from File Explorer.
    - ./debug:/app/debug
    # Uploaded PDFs and everything derived from them. Shared by the API and the worker.
    - storage_data:/data/storage
    - model_cache:/data/models

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catalogue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run ./scripts/init-env.sh}
      POSTGRES_DB: ${POSTGRES_DB:-catalogue}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: applies migrations, then exits. API and worker wait for it to succeed.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *backend
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --hostname=worker@%n
      # Each pipeline job holds page bitmaps in memory: keep parallelism modest.
      - --concurrency=${WORKER_CONCURRENCY:-2}
      - -Q
      - default,pipeline,interactive
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d worker@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      # Server-side rewrite target: the browser only ever talks to the frontend origin.
      BACKEND_INTERNAL_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  storage_data:
  model_cache:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_next_cache:
