name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: catalogue
          POSTGRES_PASSWORD: ci-only-password  # throw-away service container, not a real secret
          POSTGRES_DB: catalogue
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catalogue -d catalogue"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://catalogue:ci-only-password@localhost:5432/catalogue
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-for-tests-0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # OpenCV (inside the text-recognition engine) needs libGL
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      - run: pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt -r requirements-ml.txt
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `npm ci` once a package-lock.json is committed (it should be); install until then.
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          ./scripts/init-env.sh
          docker compose config --quiet
